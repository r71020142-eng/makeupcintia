<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 90" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA75"/>
      <stop offset="50%" stop-color="#C8A261"/>
      <stop offset="100%" stop-color="#9E7A38"/>
    </linearGradient>
  </defs>
  
  <!-- Monograma CN (left edge at 15px) -->
  <g transform="translate(12, 10)">
    <!-- Círculo externo fino decorativo -->
    <circle cx="35" cy="35" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="190 10"/>
    <circle cx="35" cy="35" r="28" fill="none" stroke="#E2D1C3" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Letra C e N entrelaçadas -->
    <text x="24" y="44" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="29" font-style="italic" fill="url(#goldGrad)" font-weight="400">C</text>
    <text x="35" y="46" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="28" fill="#5C4A3E" font-weight="500">N</text>
    
    <!-- Ponto de brilho dourado -->
    <circle cx="35" cy="18" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Tipografia Principal CINTYA NUNES (right edge at 449px, right margin 15px) -->
  <g transform="translate(97, 12)">
    <text x="0" y="34" font-family="'Playfair Display', 'Cinzel', 'Didot', 'Times New Roman', serif" font-size="26" letter-spacing="4.5" fill="#3D2E24" font-weight="500">CINTYA NUNES</text>
    <line x1="2" y1="44" x2="352" y2="44" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="2" y="58" font-family="'Montserrat', 'Libre Franklin', 'Helvetica Neue', sans-serif" font-size="8.5" letter-spacing="4" fill="#7A685B" font-weight="400">MAKEUP ARTIST &amp; HAIRSTYLES</text>
  </g>
</svg>
