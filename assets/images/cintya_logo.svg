<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%">
  <style>
    .brand-name {
      font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 5px;
      fill: #221C18;
      text-anchor: middle;
    }
    .brand-sub {
      font-family: 'Montserrat', 'Libre Franklin', 'Helvetica Neue', sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 5.5px;
      fill: #C8A261;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .accent-line {
      stroke: #C8A261;
      stroke-width: 0.8;
      opacity: 0.6;
    }
  </style>
  <!-- Text Brand -->
  <text x="230" y="36" class="brand-name">CINTYA NUNES</text>
  <line x1="80" y1="46" x2="140" y2="46" class="accent-line" />
  <text x="230" y="52" class="brand-sub">MAKEUP ARTIST &amp; HAIRSTYLES</text>
  <line x1="320" y1="46" x2="380" y2="46" class="accent-line" />
</svg>
